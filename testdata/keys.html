<!DOCTYPE html>
<html><head><title>Keys test</title></head>
<body>
<p id="out">idle</p>
<input name="q" id="q"><input name="r" id="r">
<form id="f" action="result.html"><input name="w" id="w"></form>
<script>
const log = [];
const q = document.getElementById("q"), r = document.getElementById("r"), w = document.getElementById("w");
q.addEventListener("focus", () => log.push("q focus"));
q.addEventListener("blur", () => log.push("q blur"));
r.addEventListener("focus", () => log.push("r focus"));
q.addEventListener("keydown", e => { log.push("down " + e.key); if (e.key === "x") e.preventDefault(); });
q.addEventListener("input", () => log.push("input " + q.value));
q.addEventListener("change", () => { log.push("change " + q.value); document.getElementById("out").textContent = log.join(" | "); });
w.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("out").textContent = "enter stopped"; } });
</script>
</body></html>
